<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social preview — 1200×630</title>
<style>
  /* Source for assets/og.png. Open this file at exactly 1200×630 and capture
     the viewport; the result is what LinkedIn, WhatsApp and Slack render when
     the link is shared. Kept in the repo so the card is regenerated, not
     redrawn by hand, whenever the figures change.

     Sizing rule: LinkedIn shows this at roughly 500px wide, so every size here
     is set for a 40% reduction. Nothing below 28px survives that. */

  @font-face {
    font-family: 'Saira Extra Condensed';
    src: url('../fonts/saira-extra-condensed-700.woff2') format('woff2');
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../fonts/jetbrains-mono.woff2') format('woff2');
    font-weight: 400 500;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: #f8f7ea;
    color: #141514;
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  /* the paper, same plate the site uses */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('../../assets/plates/ground.png');
    background-size: 600px;
    opacity: 0.55;
  }

  .card {
    position: relative;
    height: 100%;
    padding: 46px 56px 40px;
    display: flex;
    flex-direction: column;
  }

  /* --- top line ---------------------------------------------------------- */
  .top {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-bottom: 22px;
    border-bottom: 2px solid #141514;
  }

  .portrait {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    object-fit: cover;
    flex: 0 0 auto;
  }

  .name {
    font-size: 27px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    line-height: 1.35;
  }
  .name span { color: #4a4a44; }

  .stamp {
    margin-left: auto;
    flex: 0 0 auto;
    padding: 12px 20px 10px;
    border: 4px solid #a21715;
    border-radius: 4px;
    color: #a21715;
    font-family: 'Saira Extra Condensed', sans-serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transform: rotate(-3deg);
    white-space: nowrap;
  }

  /* --- the figure -------------------------------------------------------- */
  .body {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 44px;
    padding-block: 18px;
    min-height: 0;
  }

  .lead { flex: 1 1 auto; min-width: 0; }

  .lead__fig {
    font-family: 'Saira Extra Condensed', sans-serif;
    font-weight: 700;
    font-size: 196px;
    line-height: 0.76;
    letter-spacing: -0.015em;
    white-space: nowrap;
  }

  .lead__cap {
    margin-top: 20px;
    font-size: 25px;
    line-height: 1.38;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    max-width: 15ch;
  }
  .lead__cap em {
    display: block;
    margin-top: 7px;
    font-style: normal;
    font-size: 20px;
    color: #4a4a44;
    letter-spacing: 0.09em;
  }

  /* --- the three supporting figures -------------------------------------- */
  .stats {
    flex: 0 0 330px;
    list-style: none;
    border-left: 2px solid #141514;
    padding-left: 34px;
    display: grid;
    gap: 0;
  }

  .stat {
    padding-block: 13px;
    border-bottom: 1px solid #c9c7bd;
  }
  .stat:last-child { border-bottom: 0; }

  .stat__fig {
    font-family: 'Saira Extra Condensed', sans-serif;
    font-weight: 700;
    font-size: 82px;
    line-height: 0.82;
  }

  .stat__label {
    display: block;
    margin-top: 8px;
    font-size: 19px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #4a4a44;
  }

  /* --- foot -------------------------------------------------------------- */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding-top: 20px;
    border-top: 2px solid #141514;
    font-size: 25px;
    letter-spacing: 0.05em;
  }
  .foot__site { color: #4a4a44; }
  .foot__stamp {
    font-size: 22px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #1f3f8f;
  }
</style>
</head>
<body>
  <div class="card">

    <div class="top">
      <img class="portrait" src="../../assets/plates/portrait.png" alt="">
      <p class="name">Gustavo Schmid de Jesus <span>/ Software Engineer</span></p>
      <p class="stamp">Senior · 12 yrs</p>
    </div>

    <div class="body">
      <div class="lead">
        <p class="lead__fig">US$ 800k</p>
        <p class="lead__cap">
          Saved in the first year
          <em>Pharmaceutical inventory, city health department</em>
        </p>
      </div>

      <ul class="stats">
        <li class="stat">
          <span class="stat__fig">172</span>
          <span class="stat__label">Health locations</span>
        </li>
        <li class="stat">
          <span class="stat__fig">80%</span>
          <span class="stat__label">Faster jobs</span>
        </li>
        <li class="stat">
          <span class="stat__fig">70%</span>
          <span class="stat__label">Lower latency</span>
        </li>
      </ul>
    </div>

    <div class="foot">
      <span>gutors.com.br</span>
      <span class="foot__stamp">Backend &amp; full stack · Maceió, Brazil</span>
    </div>

  </div>
</body>
</html>
